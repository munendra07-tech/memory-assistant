name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and API tests
        run: pytest -q
      - name: Evaluation gate (fails if fewer than 17 of 27 cases pass)
        run: python evals/run_evals.py --min-pass 17
      - name: Harder evaluation set, hash baseline (fails if fewer than 12 of 24 cases pass)
        run: python evals/run_evals.py --cases evals/cases_extra.jsonl --min-pass 12

  # The jobs above use Qdrant's in-memory mode. This one runs the store and the MCP server
  # against a real Qdrant server, so persistence and per-user isolation are proven on every push.
  qdrant-server:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6333/healthz && exit 0
            sleep 2
          done
          echo "Qdrant did not become healthy" && exit 1
      - name: Tests against a real Qdrant server
        env:
          TEST_QDRANT_URL: http://127.0.0.1:6333
        run: pytest -q tests/test_qdrant_server.py

  # Builds the image from the Dockerfile and checks the container answers and is healthy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t memory-assistant:ci .
      - name: Run it and check /health
        run: |
          docker run -d --name app -p 8000:8000 -e API_KEY=ci-only-not-a-secret memory-assistant:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/memories/asha)" = "401"
          test "$(docker exec app id -u)" = "10001"
      - name: Show logs if it failed
        if: failure()
        run: docker logs app
