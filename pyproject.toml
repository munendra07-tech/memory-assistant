[project]
name = "memory-assistant"
version = "0.1.0"
description = "FastAPI assistant with per-user long-term memory on Qdrant, plus an evaluation suite"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qdrant-client>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anthropic>=1"]
local = ["fastembed>=0.3"]
anthropic = ["anthropic>=1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
