[project]
name = "memory-assistant"
version = "0.1.0"
description = "Per-user long-term memory for AI assistants on Qdrant: REST API, MCP server and an evaluation suite"
readme = "README.md"
license = { text = "MIT" }
keywords = ["memory", "llm", "qdrant", "mcp", "fastapi", "agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qdrant-client>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anthropic>=1", "mcp>=1.2,<2"]
mcp = ["mcp>=1.2,<2"]
local = ["fastembed>=0.3"]
anthropic = ["anthropic>=1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
